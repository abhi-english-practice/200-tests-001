<style>
:root{--ink:#171a2b;--muted:#74798b;--bg:#f4f1ed;--paper:#fff;--accent:#24284f;--line:#e6e3df;--good:#e7f4e8;--bad:#fbe8e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}
.app{max-width:980px;margin:auto;padding:18px}.hero{background:var(--accent);color:white;padding:22px;border-radius:20px}
.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;opacity:.8}
.bar{position:sticky;top:0;z-index:20;margin:12px 0;background:rgba(255,255,255,.96);border:1px solid var(--line);padding:9px;border-radius:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
button,select,input.name{border:1px solid var(--line);background:white;padding:9px 11px;border-radius:9px;font-weight:650}
button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}#clock{margin-left:auto;font-weight:800}
.progress{height:6px;background:#e5e4e8;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#6d7195;width:0}
.card{background:var(--paper);border-radius:17px;padding:18px;margin:12px 0;border:1px solid var(--line)}
.meta{color:var(--muted);font-size:12px}.stem{font-size:16px;font-weight:650;margin:8px 0 12px}
.choice{display:block;border:1px solid var(--line);border-radius:11px;margin:7px 0;cursor:pointer}
.choice input{display:none}.choice span{display:block;padding:10px 12px}.choice:has(input:checked){border-color:#777c9d;background:#f0f0f7}
.card.correct{background:var(--good)}.card.wrong{background:var(--bad)}
.explain{display:none;margin-top:11px;padding:11px;background:#f8f7f4;border-radius:10px}.showexp .explain{display:block}
.explain table{width:100%;border-collapse:collapse}.explain td{border-top:1px solid #ddd;padding:6px;vertical-align:top}
.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{width:36px;height:34px;padding:0}.nav button.done{background:#ececf4}.nav button.flag{outline:2px solid #d3a63a}
#summary{display:none}.score{font-size:34px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid button{padding:6px 0}.question-panel{position:sticky;top:70px;z-index:15;background:rgba(255,253,247,.98);padding:6px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.question-tabs{display:flex;gap:5px;margin-bottom:5px}.question-tabs button{flex:1;padding:4px;font-size:12px}.question-tabs button.active{background:var(--accent);color:#fff}.question-nav{display:grid;grid-template-columns:repeat(25,1fr);gap:3px}.question-nav button{height:24px;padding:0;font-size:11px;border-radius:6px}.question-nav button.done{background:#e4f2e7;border-color:#83b18b}.question-nav button.todo{background:#fff}.question-nav button.current{outline:2px solid var(--accent)}.hidden{display:none!important}
@media(max-width:650px){.app{padding:8px}.hero h1{font-size:20px}.grid{grid-template-columns:repeat(5,1fr)}#clock{margin-left:0}.card{padding:14px}.question-nav{grid-template-columns:repeat(10,1fr)}}

/* Ivory + burgundy classroom theme */
:root{--ink:#2b2022;--muted:#7b6c6e;--bg:#f8f3e8;--paper:#fffdf7;--accent:#741f2d;--accent2:#9b3142;--line:#e7d8ce;--good:#e4f2e7;--bad:#f7dfdf}

.hero{background:linear-gradient(135deg,#741f2d,#8e2b3b);color:#fffdf7}
.bar{background:rgba(255,253,247,.97);border-color:var(--line)}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:white!important}
button{color:var(--ink)} .card{background:var(--paper);border-color:var(--line)}

.card.wrong{background:var(--bad);border-color:#cf8d8d}
.explain{background:#fff9ef;border:1px solid #eadbca}

.lockbox input{width:min(330px,100%);padding:10px;border:1px solid var(--line);border-radius:9px}
#printArea{display:none}
@media print{

}

wback", "pay", "unanimous"], "answer": 2, "coll": "pay attention", "example": "You must pay attention during the safety briefing.", "vi": "Bạn phải chú ý trong buổi hướng dẫn an toàn.", "gloss": ["địa điểm tổ chức", "hạn chế/bất lợi", "trả/chú ý", "nhất trí"]}, {"n": 12, "code": "V012", "stem": "The course gives students practical ______ in a real office.", "options": ["accommodate", "believable", "essential", "experience"], "answer": 3, "coll": "practical experience", "example": "The course gives students practical experience in a real office.", "vi": "Khóa học mang lại cho sinh viên kinh nghiệm thực tế trong văn phòng thật.", "gloss": ["đáp ứng/chứa", "đáng tin/thuyết phục", "thiết yếu", "kinh nghiệm"]}, {"n": 13, "code": "V013", "stem": "______ rain flooded several streets last night.", "options": ["Heavy", "decrease", "highly", "reply"], "answer": 0, "coll": "heavy rain", "example": "Heavy rain flooded several streets last night.", "vi": "Mưa lớn đã làm ngập một số con phố tối qua.", "gloss": ["nặng/mạnh", "giảm/sự giảm", "rất/cao độ", "trả lời"]}, {"n": 14, "code": "V014", "stem": "The sales team worked hard to ______ a target of 500 orders.", "options": ["take", "reach", "current", "readily"], "answer": 1, "coll": "reach a target", "example": "The sales team worked hard to reach a target of 500 orders.", "vi": "Đội bán hàng đã làm việc chăm chỉ để đạt mục tiêu 500 đơn hàng.", "gloss": ["lấy/thực hiện", "xem nghĩa theo ngữ cảnh/cụm từ", "hiện tại", "dễ dàng/sẵn sàng"]}, {"n": 15, "code": "V015", "stem": "We had to ______ a meeting because the manager was ill.", "options": ["keep", "complicated", "postpone", "reduce"], "answer": 2, "coll": "postpone a meeting", "example": "We had to postpone a meeting because the manager was ill.", "vi": "Chúng tôi phải hoãn một cuộc họp vì quản lý bị ốm.", "gloss": ["giữ", "phức tạp", "xem nghĩa theo ngữ cảnh/cụm từ", "giảm"]}, {"n": 16, "code": "V016", "stem": "Nora will ______ charge while the director is away.", "options": ["commit", "abundant", "conducting", "take"], "answer": 3, "coll": "take charge", "example": "Nora will take charge while the director is away.", "vi": "Nora sẽ phụ trách trong thời gian giám đốc vắng mặt.", "gloss": ["phạm/cam kết", "dồi dào", "tiến hành", "lấy/thực hiện"]}, {"n": 17, "code": "V017", "stem": "The organisation needs a ______ qualified accountant.", "options": ["highly", "decrease", "fierce", "stubborn"], "answer": 0, "coll": "highly qualified", "example": "The company needs a highly qualified accountant.", "vi": "Công ty cần một kế toán có trình độ chuyên môn cao.", "gloss": ["rất/cao độ", "giảm/sự giảm", "gay gắt", "bướng bỉnh"]}, {"n": 18, "code": "V018", "stem": "Everyone should ______ an effort to arrive on time.", "options": ["many", "make", "reveal", "approximately"], "answer": 1, "coll": "make an effort", "example": "Everyone should make an effort to arrive on time.", "vi": "Mọi người nên nỗ lực đến đúng giờ.", "gloss": ["nhiều", "làm/tạo", "tiết lộ/cho thấy", "xấp xỉ"]}, {"n": 19, "code": "V019", "stem": "Applicants must ______ requirements for both experience and qualifications.", "options": ["address", "contract", "meet", "boost"], "answer": 2, "coll": "meet requirements", "example": "Applicants must meet requirements for both experience and qualifications.", "vi": "Ứng viên phải đáp ứng các yêu cầu về cả kinh nghiệm lẫn bằng cấp.", "gloss": ["giải quyết/phát biểu với", "hợp đồng", "đáp ứng/gặp", "thúc đẩy"]}, {"n": 20, "code": "V020", "stem": "There is ______ demand for affordable housing in the city.", "options": ["consider", "obstacle", "prohibit", "strong"], "answer": 3, "coll": "strong demand", "example": "There is strong demand for affordable housing in the city.", "vi": "Có nhu cầu lớn về nhà ở giá phải chăng trong thành phố.", "gloss": ["cân nhắc", "trở ngại", "cấm", "mạnh"]}, {"n": 21, "code": "V021", "stem": "The chart shows a sharp ______ in energy use.", "options": ["decrease", "closely", "mounting", "varied"], "answer": 0, "coll": "sharp decrease", "example": "The chart shows a sharp decrease in energy use.", "vi": "Biểu đồ cho thấy mức giảm mạnh về sử dụng năng lượng.", "gloss": ["giảm/sự giảm", "chặt chẽ", "ngày càng tăng", "đa dạng"]}, {"n": 22, "code": "V022", "stem": "All technicians are technically ______ to operate the equipment.", "options": ["allow", "competent", "delayed", "analyse"], "answer": 1, "coll": "technically competent", "example": "All technicians are technically competent to operate the equipment.", "vi": "Tất cả kỹ thuật viên đều có đủ năng lực chuyên môn để vận hành thiết bị.", "gloss": ["cho phép", "có năng lực", "bị trì hoãn", "phân tích"]}, {"n": 23, "code": "V023", "stem": "You should read every clause before you sign a ______.", "options": ["relies", "compelling", "contract", "vulnerable"], "answer": 2, "coll": "sign a contract", "example": "You should read every clause before you sign a contract.", "vi": "Bạn nên đọc từng điều khoản trước khi ký hợp đồng.", "gloss": ["phụ thuộc", "thuyết phục", "hợp đồng", "dễ bị tổn thương"]}, {"n": 24, "code": "V024", "stem": "Vaccination can ______ disease from spreading rapidly.", "options": ["granted", "surpassed", "consumer", "prevent"], "answer": 3, "coll": "prevent disease", "example": "Vaccination can prevent disease from spreading rapidly.", "vi": "Tiêm chủng có thể ngăn bệnh lây lan nhanh chóng.", "gloss": ["được cấp/cho phép", "vượt qua", "người tiêu dùng", "ngăn chặn"]}, {"n": 25, "code": "V025", "stem": "______ weather can disrupt mountain trips.", "options": ["Unpredictable", "secure", "faced", "enlarge"], "answer": 0, "coll": "unpredictable weather", "example": "Unpredictable weather can disrupt mountain trips.", "vi": "Thời tiết khó đoán có thể làm gián đoạn các chuyến đi vùng núi.", "gloss": ["khó đoán", "đảm bảo/giành được", "đối mặt", "phóng to/mở rộng"]}, {"n": 26, "code": "V026", "stem": "A mediator may ______ solve the dispute.", "options": ["bear", "help", "reply", "deteriorate"], "answer": 1, "coll": " t the event will be cancelled.", "vi": "Có một khả năng rất nhỏ là sự kiện sẽ bị hủy.", "gloss": ["xa xôi/khả năng rất nhỏ", "dễ dàng/sẵn sàng", "triển khai", "đạt tới"]}, {"n": 198, "code": "V198", "stem": "The proposal received ______ support from local residents.", "options": ["compatible", "unanimous", "complicated", "postponed"], "answer": 1, "coll": "unanimous support", "example": "The proposal received unanimous support from local residents.", "vi": "Đề xuất nhận được sự ủng hộ nhất trí từ cư dân địa phương.", "gloss": ["tương thích", "nhất trí", "phức tạp", "xem nghĩa theo ngữ cảnh/cụm từ"]}, {"n": 199, "code": "V199", "stem": "She went to hospital because of ______ pain in her back.", "options": ["unwilling", "abundant", "severe", "accepted"], "answer": 2, "coll": "severe pain", "example": "She went to hospital because of severe pain in her back.", "vi": "Cô ấy đến bệnh viện vì bị đau lưng dữ dội.", "gloss": ["không sẵn lòng", "dồi dào", "nghiêm trọng", "được chấp nhận"]}, {"n": 200, "code": "V200", "stem": "The books were ______ packed into two boxes.", "options": ["stubborn", "important", "following", "tightly"], "answer": 3, "coll": "tightly packed", "example": "The books were tightly packed into two boxes.", "vi": "Những cuốn sách được xếp chặt trong hai chiếc hộp.", "gloss": ["bướng bỉnh", "quan trọng", "tiếp theo", "chặt chẽ"]}];
let current=Q,seconds=5400,paused=false,submitted=false,timer=null;
const $=s=>document.querySelector(s);
function storageKey(){return 'aptis200_'+($('#student').value.trim()||'student')+'_'+$('#set').value}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function chooseSet(){
 current=Q; seconds=90*60; submitted=false; paused=false;
 $('#summary').style.display='none'; document.body.classList.remove('showexp');
 render();load();clearInterval(timer);timer=setInterval(tick,1000);updateClock()
}
function render(){
 $('#questions').innerHTML=current.map(q=>`<div class="card" id="q${q.n}" data-n="${q.n}">
 <div class="meta">${q.code} · Question ${q.n}</div><div class="stem">${esc(q.stem)}</div>
 ${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="q${q.n}" value="${i}"><span><b>${'ABCD'[i]}.</b> ${esc(o)}</span></label>`).join('')}
 <div class="explain"><b>Answer: ${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</b><br>
 <b>Collocation:</b> ${esc(q.coll)}<br><b>EN:</b> ${esc(q.example)}<br><b>VI:</b> ${esc(q.vi)}
 <table>${q.options.map((o,i)=>`<tr><td><b>${i===q.answer?'✓':'✗'} ${'ABCD'[i]}. ${esc(o)}</b></td><td>${esc(q.gloss[i])}${i===q.answer?' — đúng collocation/ngữ cảnh.':' — không phải đáp án phù hợp trong câu này.'}</td></tr>`).join('')}</table></div></div>`).join('');
 document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{save();progress()}));
}
function save(){
 let a={};document.querySelectorAll('input:checked').forEach(x=>a[x.name]=x.value);
 localStorage.setItem(storageKey(),JSON.stringify({a,seconds,student:$('#student').value}));
 progress()
}
function load(){
 try{let d=JSON.parse(localStorage.getItem(storageKey())||'{}');if(d.a)Object.entries(d.a).forEach(([k,v])=>{let x=document.querySelector(`input[name="${k}"][value="${v}"]`);if(x)x.checked=true});if(Number.isFinite(d.seconds))seconds=d.seconds}catch(e){} progress()
}
function progress(){
 let done=document.querySelectorAll('input:checked').length;
 $('#prog').style.width=(done/current.length*100)+'%';
 $('#status').textContent=`Answered ${done}/${current.length} · Unanswered ${current.length-done}`;
 renderQuestionNav();
}
let navSet=0;
function renderQuestionNav(){
 const nav=$('#questionNav');
 if(!nav)return;
 const start=navSet*50+1;
 const end=start+49;
 nav.innerHTML=current.filter(q=>q.n>=start&&q.n<=end).map(q=>{
   const checked=!!document.querySelector(`input[name=q${q.n}]:checked`);
   return `<button class="${checked?'done':'todo'}" title="${checked?'Question '+q.n+' completed':'Question '+q.n+' not completed'}" onclick="jumpQuestion(${q.n})">${q.n}</button>`;
 }).join('');
}
function changeNavSet(i){
 navSet=i;
 document.querySelectorAll('.question-tabs button').forEach((b,x)=>b.classList.toggle('active',x===i));
 renderQuestionNav();
}
function jumpQuestion(n){
 const el=document.getElementById('q'+n);
 if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function tick(){if(!paused&&!submitted&&seconds>0){seconds--;updateClock();if(seconds%5===0)save();if(seconds===0)submit()}}
function updateClock(){let m=Math.floor(seconds/60),s=seconds%60;$('#clock').textContent=`${m}:${String(s).padStart(2,'0')}`}
function submit(){
 const answered=document.querySelectorAll('input[type=radio]:checked').length;
 if(answered!==200){
   alert(`You must complete all 200 questions before submitting.
Bạn phải hoàn thành đủ 200/200 câu mới được nộp bài.
Hiện đã làm: ${answered}/200.`);
   const first=current.find(q=>!document.querySelector(`input[name=q${q.n}]:checked`));
   if(first) document.getElementById('q'+first.n).scrollIntoView({behavior:'smooth',block:'center'});
   return;
 }
 submitted=true;paused=true;let score=0;
 current.forEach(q=>{
   let x=document.querySelector(`input[name=q${q.n}]:checked`),c=$(`#q${q.n}`);
   c.classList.remove('correct','wrong');
   if(x && +x.value===q.answer){score++;c.classList.add('correct')} else c.classList.add('wrong');
 });
 $('#score').textContent=`${score} / 200`;
 $('#resultText').textContent=`${$('#student').value||'Student'} · ${Math.round(score/200*100)}% · Completed 200/200`;
 $('#summary').style.display='block';
 $('#reviewGrid').innerHTML=current.map(q=>`<button onclick="document.getElementById('q${q.n}').scrollIntoView({behavior:'smooth'})" style="background:${document.getElementById('q'+q.n).classList.contains('correct')?'#e4f2e7':'#f7dfdf'}">${q.n}</button>`).join('');
 $('#summary').scrollIntoView({behavior:'smooth'});save();
 buildPrint(score);
}
$('#start').onclick=chooseSet;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause'};
$('#submit').onclick=()=>{if(confirm('Submit the completed 200-question test now?\nNộp bài sau khi đã hoàn thành đủ 200 câu?'))submit()};


const TEACHER_PASSWORD='stcutecuacouyen';
$('#unlock').onclick=()=>{
 if(!submitted){$('#lockMsg').textContent=' Submit the test first / Hãy nộp bài trước.';return}
 if($('#teacherPassword').value===TEACHER_PASSWORD){
   document.body.classList.add('showexp');
   $('#lockMsg').textContent=' Unlocked / Đã mở phần giải thích.';
   document.getElementById('questions').scrollIntoView({behavior:'smooth'});
 }else{
   document.body.classList.remove('showexp');
   $('#lockMsg').textContent=' Incorrect password / Sai mật khẩu.';
 }
};
function buildPrint(score){
 const name=($('#student').value||'Student').replace(/[<>&]/g,'');
 const now=new Date().toLocaleString('vi-VN');
 $('#printArea').innerHTML=`<h1>APTIS B2 · 200Q TEST RESULT</h1>
 <p><b>Student:</b> ${name}</p><p><b>Score:</b> ${score}/200 (${Math.round(score/200*100)}%)</p>
 <p><b>Completed:</b> 200/200</p><p><b>Submitted:</b> ${now}</p>
 <hr><p>Green = correct · Red = incorrect.</p>`;
}
$('#pdfBtn').onclick=()=>{
 if(!submitted){alert('Submit first / Hãy nộp bài trước.');return}
 window.print();
};

$('#copy').onclick=()=>navigator.clipboard.writeText($('#score').textContent+' | '+$('#resultText').textContent);
$('#reset').onclick=()=>{if(confirm('Clear saved answers for this student/set?')){localStorage.removeItem(storageKey());chooseSet()}};
$('#student').addEventListener('change',()=>load());current=Q;seconds=90*60;render();progress();timer=setInterval(tick,1000);updateClock();
</script></body></html>
